<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131b">
<title>Dosto ka Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e8e8ea;height:100dvh;display:flex;flex-direction:column}
button{padding:11px 16px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-size:15px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #333;background:#1b1e25;color:inherit;font-size:16px;min-width:0}
#join{margin:auto;text-align:center;padding:24px;width:min(380px,92%)}
#join p{color:#aeb4c2;font-size:13px}
#join button{margin-top:12px;width:100%}
#swap{background:none;color:#8fb0ff;font-size:14px;margin-top:4px}
#err{color:#ff8585;min-height:22px;margin-top:8px;font-size:14px}
#app{display:none;flex-direction:column;height:100%;min-height:0}
header{padding:10px 14px;background:#171a21;border-bottom:1px solid #262a33;font-size:14px}
#top{display:flex;justify-content:space-between;align-items:center;gap:12px}
#out{padding:7px 11px;font-size:12px;background:#2a2f3a}
#online{color:#6ee7a0;margin-top:4px;overflow-x:auto;white-space:nowrap;font-size:12px}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
.m{max-width:82%;padding:9px 12px;border-radius:13px;background:#1b1e25;word-wrap:break-word;overflow-wrap:anywhere}
.m b{display:block;font-size:12px;color:#9bb8ff;margin-bottom:3px}
.m.me{align-self:flex-end;background:#2b4bb5}
.m.me b{display:none}
.m img{display:block;max-width:min(260px,65vw);max-height:300px;object-fit:contain;border-radius:9px;margin-top:5px}
.m a{color:#fff}
.sys{align-self:center;font-size:12px;color:#9298a5;text-align:center}
#bar{display:flex;gap:7px;align-items:center;padding:10px;background:#171a21}
#bar input{margin:0;flex:1}
#send{padding:11px 13px}
#photoBtn{padding:11px 12px;background:#303746}
#photoInput{display:none}
#hint{font-size:11px;color:#aeb4c2;padding:0 12px 8px;background:#171a21}
#status{font-size:12px;color:#ffd27a;min-height:16px;padding:0 12px 5px;background:#171a21}
</style>
</head>
<body>
<div id="join">
  <h2 id="title">Dosto ka Chat</h2>
  <p>Ek username aur password se group mein shamil ho.</p>
  <input id="name" maxlength="20" placeholder="Username" autocomplete="username">
  <input id="pass" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
  <button id="go">Login</button>
  <button id="swap">Naya account banana hai?</button>
  <div id="err" role="alert"></div>
</div>

<div id="app">
  <header>
    <div id="top"><b>Dosto ka Chat</b><button id="out">Logout</button></div>
    <div id="online">Connecting...</div>
  </header>
  <div id="msgs" aria-live="polite"></div>
  <div id="status"></div>
  <div id="bar">
    <input id="text" maxlength="1000" placeholder="Message likho..." autocomplete="off">
    <input id="photoInput" type="file" accept="image/*">
    <button id="photoBtn" title="Photo bhejo" aria-label="Photo bhejo">＋</button>
    <button id="send">Send</button>
  </div>
  <div id="hint">Photo limit: 5 MB. Sirf image files allowed hain.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  updateProfile, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getDatabase, ref, push, set, onValue, onChildAdded, onDisconnect,
  query, limitToLast, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

// Apne Firebase project ka config yahan rakhein.
const firebaseConfig = {
  apiKey: "AIzaSyBZkB5tUPEPCxFiAyPJaThrpof7NO_ffFw",
  authDomain: "chatappdibya.firebaseapp.com",
  databaseURL: "https://chatappdibya-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chatappdibya",
  appId: "1:266503318985:web:0c3d26fd2c4d5e470d8c18"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getDatabase(firebaseApp);
const storage = getStorage(firebaseApp);
const $ = id => document.getElementById(id);

let me = null;
let signup = false;
let started = false;
let busy = false;
const seen = new Set();

function showError(message) { $("err").textContent = message; }
function setStatus(message = "") { $("status").textContent = message; }

function friendlyError(error) {
  const messages = {
    "auth/email-already-in-use": "Ye username pehle se liya gaya hai. Dusra username try karo.",
    "auth/invalid-credential": "Username ya password galat hai.",
    "auth/user-not-found": "Ye account nahi mila. Pehle account banao.",
    "auth/wrong-password": "Password galat hai.",
    "auth/weak-password": "Password kam se kam 6 characters ka rakho.",
    "auth/operation-not-allowed": "Firebase Console mein Email/Password sign-in enable karo.",
    "auth/network-request-failed": "Internet connection check karo.",
    "auth/too-many-requests": "Bahut attempts hue. Thodi der baad try karo.",
    "permission-denied": "Firebase Realtime Database rules access rok rahe hain.",
    "storage/unauthorized": "Firebase Storage rules upload ko allow nahi kar rahe.",
    "storage/quota-exceeded": "Firebase Storage quota exceed ho gaya."
  };
  return messages[error.code] || `Error: ${error.code || error.message || "Unknown error"}`;
}

$("swap").onclick = () => {
  signup = !signup;
  $("title").textContent = signup ? "Naya account" : "Dosto ka Chat";
  $("go").textContent = signup ? "Account banao" : "Login";
  $("swap").textContent = signup ? "Pehle se account hai? Login" : "Naya account banana hai?";
  showError("");
};

async function submit() {
  if (busy) return;
  const name = $("name").value.trim();
  const pass = $("pass").value;
  if (!/^[A-Za-z0-9_]{2,20}$/.test(name)) {
    showError("Username 2-20 letters, numbers ya _ ka ho. Space mat use karo.");
    return;
  }
  if (pass.length < 6) {
    showError("Password kam se kam 6 characters ka hona chahiye.");
    return;
  }

  // Firebase Auth email/password ko use karke username-only interface diya gaya hai.
  // Lowercase mapping ki wajah se Dibya aur dibya ek hi username maane jayenge.
  const email = name.toLowerCase() + "@dosto.chat";
  busy = true;
  $("go").disabled = true;
  showError("");
  try {
    if (signup) {
      const credential = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(credential.user, { displayName: name });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (error) {
    showError(friendlyError(error));
  } finally {
    busy = false;
    $("go").disabled = false;
  }
}
$("go").onclick = submit;
$("pass").onkeydown = event => { if (event.key === "Enter") submit(); };
$("name").onkeydown = event => { if (event.key === "Enter") $("pass").focus(); };
$("out").onclick = async () => {
  try { await signOut(auth); location.reload(); }
  catch (error) { setStatus(friendlyError(error)); }
};

onAuthStateChanged(auth, async user => {
  if (!user) {
    me = null;
    started = false;
    $("join").style.display = "block";
    $("app").style.display = "none";
    return;
  }
  if (started) return;
  started = true;
  me = user;
  $("join").style.display = "none";
  $("app").style.display = "flex";

  const myName = user.displayName || user.email.split("@")[0];
  const myRef = ref(db, "online/" + user.uid);
  try {
    await set(myRef, myName);
    onDisconnect(myRef).remove();

    onValue(ref(db, "online"), snapshot => {
      const names = Object.values(snapshot.val() || {});
      $("online").textContent = `● Online (${names.length}): ${names.join(", ")}`;
    }, error => setStatus(friendlyError(error)));

    onChildAdded(query(ref(db, "messages"), limitToLast(100)), snapshot => {
      if (seen.has(snapshot.key)) return;
      seen.add(snapshot.key);
      draw({ key: snapshot.key, ...snapshot.val() });
    }, error => setStatus(friendlyError(error)));
  } catch (error) {
    setStatus(friendlyError(error));
  }
});

function draw(message) {
  const item = document.createElement("div");
  if (message.system) {
    item.className = "sys";
    item.textContent = message.text || "";
  } else {
    item.className = "m" + (message.uid === me?.uid ? " me" : "");
    if (message.uid !== me?.uid) {
      const author = document.createElement("b");
      author.textContent = message.user || "Unknown";
      item.appendChild(author);
    }
    if (message.text) {
      const text = document.createElement("div");
      text.textContent = message.text;
      item.appendChild(text);
    }
    if (message.imageUrl) {
      const image = document.createElement("img");
      image.src = message.imageUrl;
      image.alt = "Shared photo";
      image.loading = "lazy";
      item.appendChild(image);
    }
  }
  $("msgs").appendChild(item);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

async function send() {
  const text = $("text").value.trim();
  if (!text || !me) return;
  $("send").disabled = true;
  try {
    await push(ref(db, "messages"), {
      uid: me.uid,
      user: me.displayName || me.email.split("@")[0],
      text: text.slice(0, 1000),
      ts: serverTimestamp()
    });
    $("text").value = "";
    setStatus("");
  } catch (error) {
    setStatus(friendlyError(error));
  } finally {
    $("send").disabled = false;
  }
}
$("send").onclick = send;
$("text").onkeydown = event => { if (event.key === "Enter") send(); };

$("photoBtn").onclick = () => $("photoInput").click();
$("photoInput").onchange = async event => {
  const file = event.target.files?.[0];
  event.target.value = "";
  if (!file || !me) return;

  if (!file.type.startsWith("image/")) {
    setStatus("Sirf image file select karo.");
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    setStatus("Photo 5 MB se chhoti honi chahiye.");
    return;
  }

  $("photoBtn").disabled = true;
  setStatus("Photo upload ho rahi hai...");
  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-80);
    const path = `chatImages/${me.uid}/${Date.now()}_${safeName}`;
    const fileRef = storageRef(storage, path);
    await uploadBytes(fileRef, file, { contentType: file.type });
    const imageUrl = await getDownloadURL(fileRef);
    await push(ref(db, "messages"), {
      uid: me.uid,
      user: me.displayName || me.email.split("@")[0],
      imageUrl,
      imageName: safeName,
      ts: serverTimestamp()
    });
    setStatus("");
  } catch (error) {
    setStatus(friendlyError(error));
  } finally {
    $("photoBtn").disabled = false;
  }
};
</script>
</body>
</html>
